name: Test error handling with invalid arguments
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: generate
          subcommand: files
          arguments: >-
            --artifact-path /tmp/nonexistent-file-that-does-not-exist.txt
            --output-path /tmp/provenance-invalid.json

      - name: Assert action failed gracefully for nonexistent artifact
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when artifact does not exist"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for nonexistent artifact"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
