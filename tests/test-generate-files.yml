name: Test generate files provenance
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test artifact
        run: |
          mkdir -p /tmp/test-artifacts
          echo "hello world" > /tmp/test-artifacts/hello.txt

      - id: action
        uses: .
        with:
          command: generate
          subcommand: files
          arguments: >-
            --artifact-path /tmp/test-artifacts
            --output-path /tmp/provenance.json
            --tag-name v1.0.0
        env:
          GITHUB_TOKEN: "dummy-token-for-testing"

      - name: Assert provenance file was created
        run: |
          echo "Checking if provenance file exists at /tmp/provenance.json"
          if [ ! -f "/tmp/provenance.json" ]; then
            echo "FAIL: provenance.json was not created"
            exit 1
          fi
          echo "PASS: provenance.json exists"

      - name: Assert provenance file is valid JSON
        run: |
          echo "Validating provenance.json is valid JSON"
          if ! python3 -m json.tool /tmp/provenance.json > /dev/null 2>&1; then
            echo "FAIL: provenance.json is not valid JSON"
            cat /tmp/provenance.json
            exit 1
          fi
          echo "PASS: provenance.json is valid JSON"

      - name: Assert provenance contains expected fields
        run: |
          echo "Checking provenance content"
          BUILDER_ID=$(python3 -c "import json,sys; d=json.load(open('/tmp/provenance.json')); print(d.get('predicate',{}).get('builder',{}).get('id',''))" 2>/dev/null || echo "")
          echo "builder.id: $BUILDER_ID"
          SUBJECT=$(python3 -c "import json,sys; d=json.load(open('/tmp/provenance.json')); print(len(d.get('subject',[])))" 2>/dev/null || echo "0")
          echo "subject count: $SUBJECT"
          if [ "$SUBJECT" = "0" ]; then
            echo "FAIL: provenance has no subjects"
            cat /tmp/provenance.json
            exit 1
          fi
          echo "PASS: provenance contains subjects"
