name: Test basic provenance generation for files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create artifact to generate provenance for
        run: |
          echo "hello world" > /tmp/test-artifact.txt

      - id: action
        uses: .
        with:
          command: generate
          subcommand: files
          arguments: >-
            --artifact-path /tmp/test-artifact.txt
            --output-path /tmp/provenance.json

      - name: Assert provenance file was created
        run: |
          if [ ! -f /tmp/provenance.json ]; then
            echo "FAIL: provenance.json was not created"
            exit 1
          fi
          echo "PASS: provenance.json exists"

      - name: Assert provenance file is valid JSON
        run: |
          if ! cat /tmp/provenance.json | python3 -m json.tool > /dev/null 2>&1; then
            echo "FAIL: provenance.json is not valid JSON"
            cat /tmp/provenance.json
            exit 1
          fi
          echo "PASS: provenance.json is valid JSON"

      - name: Assert provenance contains expected fields
        run: |
          PREDICATE_TYPE=$(python3 -c "import json,sys; d=json.load(open('/tmp/provenance.json')); print(d.get('predicateType',''))" 2>/dev/null || echo "")
          echo "predicate type: $PREDICATE_TYPE"
          if [ -z "$PREDICATE_TYPE" ]; then
            echo "FAIL: predicateType is empty"
            exit 1
          fi
          echo "PASS: provenance has predicateType: $PREDICATE_TYPE"
