name: Test basic generate files provenance
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test artifact
        run: |
          echo "hello world" > /tmp/test-artifact.txt

      - name: Set up fake slsa-provenance binary and mock curl
        run: |
          # Build a fake tarball from the committed fixture binary
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-slsa-provenance.sh" /tmp/slsa-provenance
          chmod +x /tmp/slsa-provenance
          tar -czf /tmp/fake-slsa-provenance.tar.gz -C /tmp slsa-provenance
          rm /tmp/slsa-provenance

          # Install fake curl from committed fixture
          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl.sh" /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl

          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          command: generate
          subcommand: files
          arguments: >-
            --artifact-path /tmp/test-artifact.txt
            --output-path /tmp/provenance.json

      - name: Assert provenance file was created
        run: |
          echo "Checking provenance file exists..."
          if [ ! -f /tmp/provenance.json ]; then
            echo "FAIL: provenance.json was not created"
            exit 1
          fi
          echo "PASS: provenance.json exists"

      - name: Assert provenance file is valid JSON
        run: |
          echo "Checking provenance file is valid JSON..."
          if ! python3 -m json.tool /tmp/provenance.json > /dev/null 2>&1; then
            echo "FAIL: provenance.json is not valid JSON"
            cat /tmp/provenance.json
            exit 1
          fi
          echo "PASS: provenance.json is valid JSON"

      - name: Assert provenance contains expected fields
        run: |
          echo "Checking provenance contains expected SLSA fields..."
          PREDICATE_TYPE=$(python3 -c "import json,sys; d=json.load(open('/tmp/provenance.json')); print(d.get('predicateType', ''))" 2>/dev/null || echo "")
          echo "predicateType: $PREDICATE_TYPE"
          if [ -z "$PREDICATE_TYPE" ]; then
            echo "FAIL: predicateType is empty or missing"
            cat /tmp/provenance.json
            exit 1
          fi
          echo "PASS: provenance contains expected fields"
