name: Test custom install directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create artifact to generate provenance for
        run: |
          echo "custom install dir test" > /tmp/test-artifact-custom.txt

      - id: action
        uses: .
        with:
          command: generate
          subcommand: files
          install-dir: /tmp/custom-slsa-dir
          arguments: >-
            --artifact-path /tmp/test-artifact-custom.txt
            --output-path /tmp/provenance-custom.json

      - name: Assert binary was installed in custom directory
        run: |
          echo "Checking binary in custom install dir..."
          if [ ! -f /tmp/custom-slsa-dir/slsa-provenance ]; then
            echo "FAIL: slsa-provenance binary not found in /tmp/custom-slsa-dir"
            exit 1
          fi
          echo "PASS: binary found in custom install directory"

      - name: Assert provenance file was created
        run: |
          echo "Checking provenance file exists..."
          if [ ! -f /tmp/provenance-custom.json ]; then
            echo "FAIL: provenance-custom.json was not created"
            exit 1
          fi
          echo "PASS: provenance-custom.json exists"

      - name: Assert provenance file is valid JSON with SLSA structure
        run: |
          echo "Checking provenance file is valid JSON..."
          if ! python3 -c "import json, sys; json.load(open('/tmp/provenance-custom.json'))" 2>&1; then
            echo "FAIL: provenance-custom.json is not valid JSON"
            exit 1
          fi
          HAS_PREDICATE=$(python3 -c "import json; d=json.load(open('/tmp/provenance-custom.json')); print('yes' if 'predicate' in d else 'no')" 2>/dev/null || echo "no")
          echo "has predicate: $HAS_PREDICATE"
          if [ "$HAS_PREDICATE" != "yes" ]; then
            echo "FAIL: provenance-custom.json does not contain 'predicate' field"
            exit 1
          fi
          echo "PASS: provenance has expected SLSA structure"
