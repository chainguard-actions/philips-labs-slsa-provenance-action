name: Test generate provenance for multiple release artifacts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v0.1.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple test artifacts
        run: |
          mkdir -p /tmp/release-assets
          echo "binary content v1" > /tmp/release-assets/myapp-linux-amd64
          echo "binary content v2" > /tmp/release-assets/myapp-darwin-amd64
          echo "checksum data" > /tmp/release-assets/checksums.txt

      - id: action
        uses: .
        with:
          command: generate
          subcommand: files
          arguments: >-
            --artifact-path /tmp/release-assets
            --output-path /tmp/release-provenance.json

      - name: Assert provenance file was created
        run: |
          echo "Checking for provenance file at /tmp/release-provenance.json"
          if [ ! -f "/tmp/release-provenance.json" ]; then
            echo "FAIL: release-provenance.json was not created"
            exit 1
          fi
          echo "PASS: release-provenance.json exists"

      - name: Assert provenance contains multiple subjects
        run: |
          echo "Checking provenance content for multiple subjects"
          cat /tmp/release-provenance.json

          if ! python3 -m json.tool /tmp/release-provenance.json > /dev/null 2>&1; then
            echo "FAIL: release-provenance.json is not valid JSON"
            exit 1
          fi

          SUBJECT_COUNT=$(python3 -c "import json; data=json.load(open('/tmp/release-provenance.json')); print(len(data.get('subject', [])))")
          echo "Number of subjects: $SUBJECT_COUNT"
          if [ "$SUBJECT_COUNT" -lt "1" ]; then
            echo "FAIL: expected at least 1 subject in provenance"
            exit 1
          fi
          echo "PASS: provenance contains $SUBJECT_COUNT subject(s)"

      - name: Assert provenance has SLSA predicate type
        run: |
          PREDICATE_TYPE=$(python3 -c "import json; data=json.load(open('/tmp/release-provenance.json')); print(data.get('predicateType', ''))")
          echo "predicateType: $PREDICATE_TYPE"
          if [ -z "$PREDICATE_TYPE" ]; then
            echo "FAIL: predicateType is missing from provenance"
            exit 1
          fi
          echo "PASS: predicateType is present: $PREDICATE_TYPE"
