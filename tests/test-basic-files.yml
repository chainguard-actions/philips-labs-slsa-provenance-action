name: Test basic files provenance generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy artifact file
        run: |
          echo "hello slsa provenance" > /tmp/artifact.txt

      - id: action
        uses: .
        with:
          command: generate
          subcommand: files
          arguments: >-
            --artifact-path /tmp/artifact.txt
            --output-path /tmp/provenance.json

      - name: Assert provenance file was created
        run: |
          echo "Checking provenance file exists..."
          if [ ! -f /tmp/provenance.json ]; then
            echo "FAIL: provenance.json was not created"
            exit 1
          fi
          echo "PASS: provenance.json exists"

      - name: Assert provenance file is valid JSON
        run: |
          echo "Checking provenance file is valid JSON..."
          if ! python3 -m json.tool /tmp/provenance.json > /dev/null 2>&1; then
            echo "FAIL: provenance.json is not valid JSON"
            cat /tmp/provenance.json
            exit 1
          fi
          echo "PASS: provenance.json is valid JSON"

      - name: Assert provenance contains expected fields
        run: |
          echo "Checking provenance structure..."
          TYPE=$(python3 -c "import json,sys; d=json.load(open('/tmp/provenance.json')); print(d.get('_type',''))" 2>/dev/null || echo "")
          echo "type: $TYPE"
          if [ -z "$TYPE" ]; then
            echo "FAIL: provenance _type field is missing or empty"
            cat /tmp/provenance.json
            exit 1
          fi
          echo "PASS: provenance has _type field: $TYPE"
